name: "Smoke tests :: Matrix"

on:
  workflow_dispatch:
    inputs:
      k0s-version:
        type: string
        description: The k0s version to test. Will build k0s from source if empty.
      smoke-tests:
        type: string
        description: The smoke tests to run.
        required: true
        default: >-
          [
            "basic"
          ]

run-name: "Smoke tests :: amd64"

jobs:
  build-k0s:
    if: inputs.k0s-version == ''
    name: "Build :: k0s :: linux-amd64"
    uses: ./.github/workflows/build-k0s.yml
    with:
      target-os: linux
      target-arch: amd64

  cache-k0s:
    if: inputs.k0s-version != ''
    name: "Cache :: k0s :: linux-amd64"
    runs-on: ubuntu-24.04

    steps:
      - name: "Build :: Checkout"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          show-progress: false

      - name: "Download :: k0s"
        env:
          K0S_VERSION: ${{ inputs.k0s-version }}
        run: |
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors -sSLo k0s "https://github.com/k0sproject/k0s/releases/download/$K0S_VERSION/k0s-$K0S_VERSION-amd64"
          chmod +x k0s

      - name: "Upload :: k0s"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: k0s-linux-amd64
          path: k0s

      - name: "Build :: Airgap image list"
        run: ./k0s airgap list-images --all >airgap-images-linux-amd64.txt

      - name: "Upload :: Airgap image list"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: airgap-images-linux-amd64.txt
          path: airgap-images-linux-amd64.txt

      - name: "Build :: IPv6 test image list"
        id: build-ipv6-test-image-list
        run: make ipv6-test-images-linux-amd64.txt

      - name: "Upload :: IPv6 test image list"
        if: steps.build-ipv6-test-image-list.outcome == 'success'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ipv6-test-images-linux-amd64.txt
          path: ipv6-test-images-linux-amd64.txt

  build-airgap-image-bundle:
    name: "Build :: Airgap image bundle"
    needs: [build-k0s, cache-k0s]
    if: always() && (needs.build-k0s.result == 'success' || needs.cache-k0s.result == 'success')
    uses: ./.github/workflows/build-image-bundle.yml
    with:
      image-bundle-name: airgap
      image-bundle-platform: linux-amd64

  build-ipv6-test-image-bundle:
    name: "Build :: IPv6 test image bundle"
    needs: [build-k0s, cache-k0s]
    if: always() && (needs.build-k0s.result == 'success' || needs.cache-k0s.result == 'success')
    uses: ./.github/workflows/build-image-bundle.yml
    with:
      image-bundle-name: ipv6-test
      image-bundle-platform: linux-amd64

  smoketests:
    strategy:
      fail-fast: false
      matrix:
        smoke-test: ${{ fromJSON(inputs.smoke-tests) }}

    name: "check-${{ matrix.smoke-test }} :: amd64"
    needs:
      - build-airgap-image-bundle
      - build-ipv6-test-image-bundle
    if: always() && (needs.build-airgap-image-bundle.result == 'success' && needs.build-ipv6-test-image-bundle.result == 'success')

    permissions:
      contents: read
      models: read

    uses: ./.github/workflows/smoketest.yaml
    with:
      name: ${{ matrix.smoke-test }}
      arch: amd64
